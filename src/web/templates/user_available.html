<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Закупки с ЕИС</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .load-more-container {
            text-align: center;
            padding: 20px;
        }
        .nav-user a {
            color: #64748b;
            text-decoration: none;
            margin-right: 15px;
        }
        .nav-user a.active {
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="control-panel">
            <div class="branding">
                <div class="logo">EIS Parser v2.0</div>
                <nav class="main-nav nav-user">
                    {% if is_admin %}
                    <a href="/user/available" class="active">Этап 3: Проверка</a>
                    <a href="/user/selections">Этап 4: Сбор объявлений</a>
                    {% else %}
                    <a href="/user/selections" class="active">Этап 4: Сбор объявлений</a>
                    {% endif %}
                    <a href="/" style="margin-left: 20px;">Выход</a>
                </nav>
            </div>

            <div class="stats-panel">
                <div class="stat-item total">
                    <span class="label">Всего доступно</span>
                    <span class="value" id="stat-total">0</span>
                </div>
                <div class="stat-item approved">
                    <span class="label">Выбрано</span>
                    <span class="value" id="stat-selected">0</span>
                </div>
            </div>
        </header>

        <div class="actions-bar">
            <button id="btn-select" class="btn btn-primary" disabled>
                Добавить в выборку
            </button>
            <span id="status-msg" class="status-msg"></span>
        </div>

        <div class="table-container">
            <table id="zakupki-table">
                <thead>
                    <tr>
                        <th style="width: 40px;">
                            <input type="checkbox" id="select-all">
                        </th>
                        <th>Рег. номер</th>
                        <th>Описание</th>
                        <th>Город</th>
                        <th>Площадь</th>
                        <th>Комнат</th>
                        <th>Цена</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody id="zakupki-tbody">
                    <!-- Data -->
                </tbody>
            </table>
        </div>

        <div class="load-more-container">
            <button id="btn-load-more" class="btn" style="background-color: #f1f5f9; color: #334155; display: none;">
                Показать ещё
            </button>
        </div>
    </div>

    <script>
        const userId = 1;
        let selectedIds = new Set();
        let currentOffset = 0;
        const limit = 10;
        let totalAvailable = 0;

        async function loadData(reset = false) {
            if (reset) {
                currentOffset = 0;
                document.getElementById('zakupki-tbody').innerHTML = '';
            }

            const btnLoadMore = document.getElementById('btn-load-more');
            btnLoadMore.textContent = 'Загрузка...';
            btnLoadMore.disabled = true;

            try {
                const response = await fetch(`/api/user/available_zakupki?user_id=${userId}&offset=${currentOffset}&limit=${limit}`);
                const data = await response.json();

                totalAvailable = data.total;
                const zakupki = data.zakupki || [];

                renderRows(zakupki);
                updateStats();

                currentOffset += zakupki.length;

                if (currentOffset < totalAvailable) {
                    btnLoadMore.style.display = 'inline-block';
                    btnLoadMore.textContent = 'Показать ещё';
                    btnLoadMore.disabled = false;
                } else {
                    btnLoadMore.style.display = 'none';
                }

            } catch (error) {
                showStatus('Ошибка загрузки данных: ' + error.message, 'error');
            }
        }

        function renderRows(zakupki) {
            const tbody = document.getElementById('zakupki-tbody');

            if (zakupki.length === 0 && currentOffset === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px;">Нет доступных закупок</td></tr>';
                return;
            }

            const html = zakupki.map(z => `
                <tr>
                    <td><input type="checkbox" class="row-select" data-reg="${z.reg_number}" ${z.is_selected ? 'checked' : ''}></td>
                    <td><a href="https://zakupki.gov.ru/epz/order/notice/ea44/view/common-info.html?regNumber=${z.reg_number}" target="_blank">${z.reg_number}</a></td>
                    <td>${z.description ? z.description.substring(0, 100) + '...' : '-'}</td>
                    <td>${z.city || '-'}</td>
                    <td>${z.area || '-'}</td>
                    <td>${z.rooms || '-'}</td>
                    <td>${z.initial_price ? (z.initial_price / 1000000).toFixed(2) + ' млн' : '-'}</td>
                    <td><span class="badge" style="background: #10b981;">Готово</span></td>
                </tr>
            `).join('');

            tbody.insertAdjacentHTML('beforeend', html);

            document.querySelectorAll('.row-select').forEach(cb => {
                cb.onchange = (e) => {
                    const regNumber = e.target.dataset.reg;
                    if (e.target.checked) {
                        selectedIds.add(regNumber);
                    } else {
                        selectedIds.delete(regNumber);
                    }
                    updateButtons();
                    updateStats();
                };
            });
        }

        function updateButtons() {
            const btn = document.getElementById('btn-select');
            btn.disabled = selectedIds.size === 0;
            btn.textContent = selectedIds.size > 0 ? `Добавить в выборку (${selectedIds.size})` : 'Добавить в выборку';
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = totalAvailable;
            document.getElementById('stat-selected').textContent = selectedIds.size;
        }

        async function addToSelection() {
            const btn = document.getElementById('btn-select');
            btn.disabled = true;
            btn.textContent = 'Добавление...';

            try {
                const response = await fetch('/api/user/select', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        reg_numbers: Array.from(selectedIds)
                    })
                });

                const result = await response.json();
                showStatus(result.message, 'success');

                selectedIds.clear();
                updateButtons();
                loadData(true);
            } catch (error) {
                showStatus('Ошибка: ' + error.message, 'error');
                btn.disabled = false;
            }
        }

        function showStatus(message, type = 'info') {
            const el = document.getElementById('status-msg');
            el.textContent = message;
            el.style.color = type === 'error' ? '#ef4444' : (type === 'success' ? '#10b981' : '#64748b');
            setTimeout(() => el.textContent = '', 5000);
        }

        document.getElementById('select-all').addEventListener('change', (e) => {
            const checkboxes = document.querySelectorAll('.row-select');
            checkboxes.forEach(cb => {
                cb.checked = e.target.checked;
                const regNumber = cb.dataset.reg;
                if (e.target.checked) {
                    selectedIds.add(regNumber);
                } else {
                    selectedIds.delete(regNumber);
                }
            });
            updateButtons();
            updateStats();
        });

        document.getElementById('btn-select').addEventListener('click', addToSelection);
        document.getElementById('btn-load-more').addEventListener('click', () => loadData(false));

        loadData(true);
    </script>
</body>

</html>
