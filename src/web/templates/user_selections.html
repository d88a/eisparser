<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои выборки</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .nav-user a {
            color: #64748b;
            text-decoration: none;
            margin-right: 15px;
        }
        .nav-user a.active {
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="control-panel">
            <div class="branding">
                <div class="logo">EIS Parser v2.0</div>
                <nav class="main-nav nav-user">
                    {% if is_admin %}
                    <a href="/user/available">Этап 3: Проверка</a>
                    <a href="/user/selections" class="active">Этап 4: Сбор объявлений</a>
                    {% else %}
                    <a href="/user/selections" class="active">Этап 4: Сбор объявлений</a>
                    {% endif %}
                    <a href="/" style="margin-left: 20px;">Выход</a>
                </nav>
            </div>

            <div class="stats-panel">
                <div class="stat-item total">
                    <span class="label">В выборке</span>
                    <span class="value" id="stat-total">0</span>
                </div>
            </div>
        </header>

        <div class="actions-bar">
            <button id="btn-run-stage4" class="btn btn-primary" disabled>
                Запустить сбор объявлений
            </button>
            <button id="btn-clear" class="btn" style="background-color: #ef4444; margin-left: 10px;" disabled>
                Очистить выборку
            </button>
            <button id="btn-refresh" class="btn" style="background-color: #64748b; margin-left: 10px;">
                Обновить
            </button>
            <span id="status-msg" class="status-msg"></span>
        </div>

        <div class="table-container">
            <table id="zakupki-table">
                <thead>
                    <tr>
                        <th>Рег. номер</th>
                        <th>Описание</th>
                        <th>Город</th>
                        <th>Площадь</th>
                        <th>Комнат</th>
                        <th>Цена</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="zakupki-tbody">
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px;">
                            Загрузка...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const userId = 1;
        let zakupki = [];

        async function loadData() {
            try {
                const response = await fetch(`/api/user/selections?user_id=${userId}`);
                const data = await response.json();

                zakupki = data.zakupki || [];
                renderTable();
                updateStats();
                updateButtons();
            } catch (error) {
                showStatus('Ошибка загрузки данных: ' + error.message, 'error');
            }
        }

        function renderTable() {
            const tbody = document.getElementById('zakupki-tbody');

            if (zakupki.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">Нет выбранных закупок. <a href="/user/available">Выберите закупки</a></td></tr>';
                return;
            }

            tbody.innerHTML = zakupki.map(z => `
                <tr>
                    <td><a href="https://zakupki.gov.ru/epz/order/notice/ea44/view/common-info.html?regNumber=${z.reg_number}" target="_blank">${z.reg_number}</a></td>
                    <td>${z.description ? z.description.substring(0, 100) + '...' : '-'}</td>
                    <td>${z.city || '-'}</td>
                    <td>${z.area || '-'}</td>
                    <td>${z.rooms || '-'}</td>
                    <td>${z.initial_price ? (z.initial_price / 1000000).toFixed(2) + ' млн' : '-'}</td>
                    <td>
                        <button class="btn-small btn-remove" data-reg="${z.reg_number}">Удалить</button>
                    </td>
                </tr>
            `).join('');

            document.querySelectorAll('.btn-remove').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const regNumber = e.target.dataset.reg;
                    await removeFromSelection(regNumber);
                });
            });
        }

        function updateButtons() {
            const hasItems = zakupki.length > 0;
            document.getElementById('btn-run-stage4').disabled = !hasItems;
            document.getElementById('btn-clear').disabled = !hasItems;
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = zakupki.length;
        }

        async function removeFromSelection(regNumber) {
            try {
                const response = await fetch('/api/user/unselect', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        reg_numbers: [regNumber]
                    })
                });

                await response.json();
                showStatus('Удалено из выборки', 'success');
                loadData();
            } catch (error) {
                showStatus('Ошибка: ' + error.message, 'error');
            }
        }

        async function runStage4() {
            const btn = document.getElementById('btn-run-stage4');
            btn.disabled = true;
            btn.textContent = 'Сбор объявлений...';

            try {
                const response = await fetch('/api/user/run_stage4', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        top_n: 20,
                        get_details: false
                    })
                });

                const result = await response.json();
                showStatus(result.message, result.status === 'ok' ? 'success' : 'error');

                if (result.status === 'ok') {
                    loadData();
                }
            } catch (error) {
                showStatus('Ошибка: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Запустить сбор объявлений';
            }
        }

        async function clearSelection() {
            if (!confirm('Очистить всю выборку?')) return;

            try {
                const regNumbers = zakupki.map(z => z.reg_number);

                const response = await fetch('/api/user/unselect', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        reg_numbers: regNumbers
                    })
                });

                await response.json();
                showStatus('Выборка очищена', 'success');
                loadData();
            } catch (error) {
                showStatus('Ошибка: ' + error.message, 'error');
            }
        }

        function showStatus(message, type = 'info') {
            const el = document.getElementById('status-msg');
            el.textContent = message;
            el.style.color = type === 'error' ? '#ef4444' : (type === 'success' ? '#10b981' : '#64748b');
            setTimeout(() => el.textContent = '', 5000);
        }

        document.getElementById('btn-run-stage4').addEventListener('click', runStage4);
        document.getElementById('btn-clear').addEventListener('click', clearSelection);
        document.getElementById('btn-refresh').addEventListener('click', loadData);

        loadData();
    </script>
</body>

</html>
