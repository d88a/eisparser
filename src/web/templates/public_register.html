<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIS Parser - Регистрация</title>
    <link rel="stylesheet" href="/static/css/public.css?v=20260409-v5">
</head>
<body class="bg-app">
    <header class="site-header">
        <div class="site-header-inner">
            <a href="/public/zakupki" class="brand-link">
                <div class="brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div>
                    <div class="brand-title">EIS Parser</div>
                    <div class="brand-subtitle">Прототип витрины закупок</div>
                </div>
            </a>
            <nav class="site-nav">
                <a href="/public/zakupki" class="nav-toggle-link">Витрина закупок</a>
                <a href="/public/login?next={{ next }}" class="nav-toggle-link">Войти</a>
            </nav>
        </div>
    </header>

    <main class="page-main">
        <div class="auth-container fade-in-up">
            <div class="auth-card">
                <div class="auth-title-row">
                    <h1>Регистрация</h1>
                </div>
                <p class="auth-desc">Создайте аккаунт для раздела «Мои брони».</p>

                {% if error %}
                <div class="auth-error">{{ error }}</div>
                {% endif %}

                <form method="post" action="/api/public/register" class="auth-form">
                    <input type="hidden" name="next" value="{{ next }}">
                    <div>
                        <label class="form-label" for="reg-email">Email</label>
                        <input class="form-input" type="email" id="reg-email" name="email" required placeholder="you@example.com" style="margin-top:6px;">
                    </div>
                    <div>
                        <label class="form-label" for="reg-password">Пароль</label>
                        <input class="form-input" type="password" id="reg-password" name="password" minlength="8" required placeholder="Минимум 8 символов" style="margin-top:6px;">
                    </div>
                    <div>
                        <label class="form-label" for="reg-confirm">Подтверждение пароля</label>
                        <input class="form-input" type="password" id="reg-confirm" name="password_confirm" minlength="8" required placeholder="Повторите пароль" style="margin-top:6px;">
                    </div>
                    <button class="btn btn-lg" type="submit">Зарегистрироваться</button>
                </form>

                <div class="auth-footer">
                    Уже есть аккаунт? <a href="/public/login?next={{ next }}">Войти</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
