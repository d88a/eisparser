<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIS Parser - Карточка закупки</title>
    <link rel="stylesheet" href="/static/css/public.css?v=20260409-v5">
</head>
<body class="bg-app">
    <header class="site-header">
        <div class="site-header-inner">
            <a href="/public/zakupki" class="brand-link">
                <div class="brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div>
                    <div class="brand-title">EIS Parser</div>
                    <div class="brand-subtitle">Прототип витрины закупок</div>
                </div>
            </a>
            <nav class="site-nav">
                {% if is_public_authenticated %}
                <a href="/public/zakupki" class="nav-toggle-link">Витрина закупок</a>
                <div class="account-menu" data-account-menu>
                    <button class="account-trigger" type="button" data-account-trigger>
                        <div class="profile-chip" title="{{ public_profile.email }}">
                            <div class="profile-avatar">{{ public_profile.initials }}</div>
                            <div class="profile-info">
                                <div class="profile-name">{{ public_profile.display_name }}</div>
                                <div class="profile-email">{{ public_profile.email }}</div>
                            </div>
                        </div>
                    </button>
                    <div class="account-dropdown" data-account-dropdown>
                        <a href="/public/account" class="dropdown-item">Настройки аккаунта</a>
                        <form action="/api/public/logout" method="post" class="dropdown-form">
                            <button type="submit" class="dropdown-item dropdown-danger">Выйти</button>
                        </form>
                    </div>
                </div>
                <button class="btn-logout" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span class="btn-logout-text">Выход</span>
                </button>
                {% else %}
                <a href="/public/login?next=/public/zakupki/{{ reg_number }}" class="btn btn-secondary btn-sm">Войти</a>
                <a href="/public/register?next=/public/zakupki/{{ reg_number }}" class="btn btn-outline btn-sm">Регистрация</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="page-main">
        <div class="detail-topbar fade-in-up">
            <button class="btn-back" onclick="location.href='/public/zakupki'; return false;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                К витрине закупок
            </button>
        </div>

        <section class="detail-card detail-card--main">
            <div class="detail-title-row">
                <h1 id="detail-title">Карточка закупки</h1>
            </div>
            <div class="detail-reg-number" id="detail-subtitle">Загрузка...</div>

            <div class="detail-actions">
                <button id="btn-reserve-zakupka" class="btn btn-lg">Забронировать закупку</button>
                <button id="btn-favorite" class="btn btn-outline btn-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    В избранное
                </button>
                <a id="btn-open-eis" class="btn btn-outline btn-lg" target="_blank" rel="noopener noreferrer" href="#" style="display:none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    Открыть на ЕИС
                </a>
            </div>
        </section>

        <section class="detail-card">
            <h2 class="section-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h10"/><path d="M7 12h10"/><path d="M7 17h10"/></svg>
                Характеристики
            </h2>
            <div class="features-grid" id="detail-features"></div>
        </section>

        <section class="detail-card">
            <h2 class="section-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 18h4"/><path d="M10 12h4"/><path d="M10 18h4"/></svg>
                Варианты квартир
            </h2>
            <div id="listings-container" class="listings-grid">
                <div class="empty-state">Для этой закупки пока нет вариантов квартир.</div>
            </div>
        </section>
    </main>

    <script>
        window.PUBLIC_REG_NUMBER = {{ reg_number | tojson }};
    </script>
    <script src="/static/js/public_common.js?v=20260409-v5"></script>
    <script src="/static/js/public_detail.js?v=20260409-v5"></script>
</body>
</html>
