<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIS Parser - Личный кабинет</title>
    <link rel="stylesheet" href="/static/css/public.css?v=20260408-v4">
</head>
<body class="bg-app">
    <header class="site-header">
        <div class="site-header-inner">
            <a href="/public/zakupki" class="brand-link">
                <div class="brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div>
                    <div class="brand-title">EIS Parser</div>
                    <div class="brand-subtitle">Прототип витрины закупок</div>
                </div>
            </a>
            <nav class="site-nav">
                <a href="/public/zakupki" class="nav-toggle-link">Витрина закупок</a>
                <div class="account-menu" data-account-menu>
                    <button class="account-trigger" type="button" data-account-trigger>
                        <div class="profile-chip" title="{{ public_profile.email }}">
                            <div class="profile-avatar">{{ public_profile.initials }}</div>
                            <div class="profile-info">
                                <div class="profile-name">{{ public_profile.display_name }}</div>
                                <div class="profile-email">{{ public_profile.email }}</div>
                            </div>
                        </div>
                    </button>
                    <div class="account-dropdown" data-account-dropdown>
                        <a href="/public/account" class="dropdown-item">Настройки аккаунта</a>
                        <form action="/api/public/logout" method="post" class="dropdown-form">
                            <button type="submit" class="dropdown-item dropdown-danger">Выйти</button>
                        </form>
                    </div>
                </div>
                <button class="btn-logout" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span class="btn-logout-text">Выход</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="page-main">
        <section class="page-hero fade-in-up">
            <h1 class="page-hero-title">Личный кабинет</h1>
            <p class="page-hero-desc">Брони, история изменений и избранные закупки в едином интерфейсе.</p>
        </section>

        <section class="filter-section">
            <div class="filter-grid-cabinet">
                <div class="filter-item">
                    <label class="filter-label">Статус</label>
                    <select id="cabinet-status-filter" class="filter-input">
                        <option value="all">Все</option>
                        <option value="active">Активные</option>
                        <option value="expired">Истекшие</option>
                        <option value="cancelled">Отмененные</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label class="filter-label">Сортировка</label>
                    <select id="cabinet-sort-mode" class="filter-input">
                        <option value="default">По умолчанию для вкладки</option>
                        <option value="bid_end_asc">Окончание подачи: сначала ближайшие</option>
                        <option value="bid_end_desc">Окончание подачи: сначала поздние</option>
                        <option value="history_desc">История: сначала последние завершенные</option>
                        <option value="history_asc">История: сначала ранние завершенные</option>
                    </select>
                </div>
            </div>
        </section>

        <div class="tabs-container">
            <div class="tabs-list" id="cabinet-tabs">
                <button class="tab-btn active" data-tab="active">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Активные брони <span id="count-active" class="tab-count">(0)</span>
                </button>
                <button class="tab-btn" data-tab="history">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                    История <span id="count-history" class="tab-count">(0)</span>
                </button>
                <button class="tab-btn" data-tab="favorites">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    Избранное <span id="count-favorites" class="tab-count">(0)</span>
                </button>
            </div>

            <div class="tab-content">
                <div class="table-head-row">
                    <div class="table-title" id="table-title">Активные брони</div>
                    <div class="table-meta">Всего: <span id="total-count">0</span></div>
                </div>
                <div class="table-scroll">
                    <table class="data-table data-table--cabinet" id="cabinet-table">
                        <thead>
                            <tr id="cabinet-head-row"></tr>
                        </thead>
                        <tbody id="cabinet-body">
                            <tr class="state-row"><td colspan="7" class="state-cell">Загрузка...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="table-footer">
                    <button id="btn-load-more" class="btn" style="display:none;">Показать еще</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/public_common.js?v=20260408-v4"></script>
    <script src="/static/js/public_reservations.js?v=20260409-v5"></script>
</body>
</html>
