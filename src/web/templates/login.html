<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход для администратора</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f1f5f9;
        }
        .login-form {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            width: 300px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #64748b;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }
        .error {
            color: #ef4444;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <form class="login-form" action="/admin/login" method="POST">
            <h2 style="margin-top: 0; text-align: center; color: #334155;">Админ-панель</h2>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" name="password" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
            <div style="margin-top: 15px; text-align: center;">
                <a href="/" style="color: #64748b; text-decoration: none;">← На главную</a>
            </div>
        </form>
    </div>
</body>
</html>
