<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Этап 3: Ссылки 2ГИС — EIS Parser</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .stage3-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .load-more-container {
            text-align: center;
            padding: 15px 0;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .checkbox-inline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9em;
            color: #475569;
        }
        .link-cell a {
            color: #2563eb;
            text-decoration: none;
        }
        .link-cell a:hover {
            text-decoration: underline;
        }
        .stage3-status {
            margin-bottom: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #334155;
            display: none;
        }
        .stage3-status.error {
            border-color: #fecaca;
            background: #fff1f2;
            color: #991b1b;
        }
        .stage3-status.success {
            border-color: #bbf7d0;
            background: #ecfdf5;
            color: #166534;
        }
        .stage3-errors {
            display: none;
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #fecaca;
            background: #fff1f2;
            color: #991b1b;
        }
        .stage3-error-row {
            margin: 4px 0;
            font-size: 0.9em;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="control-panel">
            <div class="branding">
                <div class="logo">EIS Parser v2.0 <span style="font-size: 0.6em; color: #64748b;">(Админ)</span></div>
                <nav class="main-nav">
                    <a href="/admin">Этап 1: Загрузка</a>
                    <a href="/admin/stage2">Этап 2: ИИ-анализ</a>
                    <a href="/admin/stage3" class="active">Этап 3: Ссылки 2ГИС</a>
                    <a href="/admin/stage4">Этап 4: Сбор объявлений</a>
                    <a href="/admin/logout" style="color: #ef4444; margin-left: 20px;">Выход</a>
                </nav>
            </div>

            <div class="stats-panel">
                <div class="stat-item total">
                    <span class="label">Всего</span>
                    <span class="value" id="stat-total">0</span>
                </div>
                <div class="stat-item approved">
                    <span class="label">Выбрано</span>
                    <span class="value" id="stat-selected">0</span>
                </div>
            </div>
        </header>

        <div class="stage3-actions">
            <div class="toolbar">
                <label class="checkbox-inline">
                    <input type="checkbox" id="select-all-stage3">
                    Выделить все на странице
                </label>
                <label class="checkbox-inline">
                    <input type="checkbox" id="overwrite-stage3">
                    Пересоздать ссылки
                </label>
            </div>
            <button id="btn-run-stage3" class="btn btn-primary" disabled>
                Сформировать ссылки 2ГИС
            </button>
        </div>

        <div id="stage3-status" class="stage3-status"></div>
        <div id="stage3-errors" class="stage3-errors"></div>

        <div class="table-container">
            <table id="zakupki-table-stage3">
                <thead>
                    <tr>
                        <th width="40"><input type="checkbox" id="select-all-stage3-head"></th>
                        <th width="180">Рег. №</th>
                        <th>Название</th>
                        <th width="160">Город</th>
                        <th width="140">Площадь</th>
                        <th width="140">Цена</th>
                        <th width="140">Окончание</th>
                        <th width="180">Ссылка 2ГИС</th>
                    </tr>
                </thead>
                <tbody id="zakupki-body-stage3"></tbody>
            </table>
        </div>

        <div class="load-more-container">
            <button id="btn-load-more-stage3" class="btn" style="background-color: #f1f5f9; color: #334155; display: none;">
                Показать ещё
            </button>
        </div>
    </div>

    <script src="/static/js/stage3.js"></script>
</body>

</html>
